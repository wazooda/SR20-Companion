<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect this iPad to the SR20</title><link rel="stylesheet" href="/app.css"></head>
<body><main>
<h1>Connect this iPad</h1>
<p id="state">Tap Connect. When the iPad asks, open it in Shortcuts and tap Allow.</p>
<p><a id="go" class="button" href="#">Connect</a></p>
<p class="muted">Your send address (it's handed to the Shortcut for you):</p>
<p><code id="addr"></code></p>
<p><button id="copy" class="plain">Copy the send address</button> <span id="copied" class="muted"></span></p>
<p class="muted">You need the <b>Send to SR20</b> Shortcut first (code 1 on the PC's setup page). After connecting:
in ForeFlight, Share FPL File &gt; Send to SR20.</p>
</main><script src="/connect.js"></script></body></html>
